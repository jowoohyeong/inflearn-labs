<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elastic Product Search Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      Elastic <span>Search Console</span>
    </div>
  </header>

  <!-- Container -->
  <div class="container">
    
    <!-- Left Column: Admin Control Panel -->
    <aside>
      <!-- Reindex Card -->
      <div class="card">
        <h2 class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Elasticsearch 재색인 (Reindex)
        </h2>
        <div class="reindex-options">
          <label class="checkbox-group">
            <input type="checkbox" id="reindex-reset" checked>
            <span>기존 인덱스 완전 초기화 (Reset)</span>
          </label>
        </div>
        <div class="form-group">
          <div class="range-label">
            <span>배치 처리 크기 (Chunk Size)</span>
            <span id="chunk-size-val">1000</span>
          </div>
          <input type="range" id="reindex-chunk" class="form-control" min="100" max="5000" step="100" value="1000" style="padding: 0;">
        </div>
        <button id="btn-reindex" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></polygon></svg>
          재색인 실행 (Sync DB ➡️ ES)
        </button>
      </div>

      <!-- Create Product Card -->
      <div class="card">
        <h2 class="card-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          신규 상품 등록
        </h2>
        <form id="product-form">
          <div class="form-group">
            <label for="p-name">상품명</label>
            <input type="text" id="p-name" class="form-control" placeholder="예: 삼성 갤럭시 북4 프로" required>
          </div>
          <div class="input-row">
            <div class="form-group">
              <label for="p-price">가격 (원)</label>
              <input type="number" id="p-price" class="form-control" placeholder="1200000" required>
            </div>
            <div class="form-group">
              <label for="p-rating">평점 (0.0 ~ 5.0)</label>
              <input type="number" id="p-rating" class="form-control" placeholder="4.5" step="0.1" min="0" max="5" required>
            </div>
          </div>
          <div class="form-group">
            <label for="p-category">카테고리</label>
            <input type="text" id="p-category" class="form-control" placeholder="예: 노트북, 스마트폰, 생활가전" required>
          </div>
          <div class="form-group">
            <label for="p-desc">상품 설명 (HTML 허용)</label>
            <textarea id="p-desc" class="form-control" placeholder="상품 상세 정보를 기재하세요. HTML 태그는 자동 필터링됩니다." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">
            상품 등록 완료
          </button>
        </form>
      </div>
    </aside>

    <!-- Right Column: Search & Dashboard -->
    <main class="search-section">
      
      <!-- Search Input Section -->
      <div class="search-bar-container">
        <input type="text" id="search-input" class="search-input" placeholder="검색어를 입력해 보세요 (예: 삼성, 맥북, 가전...)" autocomplete="off">
        <div id="suggestions-box" class="suggestions-box"></div>
      </div>

      <!-- Filters & Toggle Bar -->
      <div class="filter-bar">
        <div class="filter-item" style="flex: 0.8; min-width: 120px;">
          <label style="font-size: 0.75rem; color: var(--text-secondary); display:block; margin-bottom:0.25rem;">검색 소스</label>
          <select id="search-source" class="form-control" style="padding: 0.5rem;">
            <option value="es" selected>Elasticsearch (전문 검색)</option>
            <option value="rdb">MySQL DB (전체 목록)</option>
          </select>
        </div>
        <div class="filter-item">
          <label style="font-size: 0.75rem; color: var(--text-secondary); display:block; margin-bottom:0.25rem;">카테고리 필터</label>
          <input type="text" id="filter-category" class="form-control" placeholder="카테고리 입력" style="padding: 0.5rem;">
        </div>
        <div class="filter-item" style="flex: 1.5; min-width: 250px;">
          <label style="font-size: 0.75rem; color: var(--text-secondary); display:block; margin-bottom:0.25rem;">가격 범위 필터</label>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="number" id="filter-min-price" class="form-control" placeholder="최소" style="padding: 0.5rem;" value="0">
            <span style="color: var(--text-secondary);">~</span>
            <input type="number" id="filter-max-price" class="form-control" placeholder="최대" style="padding: 0.5rem;" value="10000000">
          </div>
        </div>
        <div class="filter-item" style="flex: 0.5; min-width: 80px;">
          <label style="font-size: 0.75rem; color: var(--text-secondary); display:block; margin-bottom:0.25rem;">&nbsp;</label>
          <button id="btn-search" class="btn btn-secondary" style="padding: 0.5rem 1rem;">조회</button>
        </div>
      </div>

      <!-- Results Header -->
      <div class="results-header">
        <div class="results-count">
          검색된 상품: <span id="results-count-num">0</span>개
        </div>
        <div class="sort-container" id="sort-container">
          <label for="sort-by">정렬 기준</label>
          <select id="sort-by" class="sort-select">
            <option value="">정확도순 (유사도)</option>
            <option value="price_asc">가격 낮은 순</option>
            <option value="price_desc">가격 높은 순</option>
            <option value="rating_desc">평점 높은 순</option>
          </select>
        </div>
      </div>

      <!-- Results Grid -->
      <div id="results-grid" class="results-grid">
        <!-- Results will be dynamically inserted here -->
        <div class="no-results">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <p>등록된 상품이 없거나 검색 결과가 없습니다.</p>
          <span style="font-size: 0.85rem; color: var(--text-secondary);">상단 검색어 입력 또는 "조회" 버튼을 클릭해 주세요.</span>
        </div>
      </div>
    </main>

  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
